# Local development dependencies: PostgreSQL + SeaweedFS (S3-compatible media storage).
# The API, worker and dashboard run on the host during development (see docs/setup.md).
# To run the whole stack in containers instead: `docker compose --profile app up --build`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible media storage (SeaweedFS; MinIO no longer publishes free images).
  # Accepts any access key locally; the worker creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data

  api:
    profiles: ["app"]
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://wa:wa@postgres:5432/wa_dashboard
      S3_ENDPOINT_URL: http://s3:8333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
