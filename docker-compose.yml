# Local development dependencies: PostgreSQL + MinIO (S3-compatible media storage).
# The API, worker and dashboard run on the host during development (see docs/setup.md).
# To run the whole stack in containers instead: `docker compose --profile app up --build`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the media bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/wa-media;
      "

  api:
    profiles: ["app"]
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://wa:wa@postgres:5432/wa_dashboard
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
