# Production on a single VM: Caddy (automatic HTTPS) → api; worker; migrations.
# PostgreSQL and S3 are expected to be managed services (DATABASE_URL / S3_* in .env).
# Usage (from the repo root):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build

services:
  migrate:
    build: ..
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: ..
    env_file: ../.env
    environment:
      APP_ENV: production
      FORWARDED_ALLOW_IPS: "*"   # only Caddy can reach this container
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose: ["8000"]

  worker:
    build: ..
    env_file: ../.env
    environment:
      APP_ENV: production
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. wa.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
